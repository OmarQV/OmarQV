<title id="title">OMAR QUISPE VARGAS — developer credential</title>
<desc id="desc">AI AGENTS × WEB3 × INFORMATION SECURITY. Software Engineer · Builder · La Paz, Bolivia · Informatics · Information Security (UMSA) · Build · Trace · Verify. Status BUILDING, latest project Vector52.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a2b"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="1" stop-color="#58a6ff" stop-opacity=".16"/></linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#1f6feb" stroke-opacity=".07"/></pattern>
  <clipPath id="av"><circle cx="120" cy="170" r="64"/></clipPath>
  <clipPath id="card"><rect x="1" y="1" width="878" height="334" rx="18"/></clipPath>
  <style>
    .spin{transform-origin:120px 170px;animation:spin 18s linear infinite}
    .scan{animation:scan 5.5s ease-in-out infinite}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(336px)}}
    @keyframes pulse{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.spin,.scan,.pulse{animation:none}}
  </style>
</defs>
<g clip-path="url(#card)">
  <rect width="880" height="336" fill="url(#bg)"/>
  <rect width="880" height="336" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="880" height="60" fill="url(#scan)"/>
</g>
