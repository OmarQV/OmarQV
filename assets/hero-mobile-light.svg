<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title description">
  <title id="title">Omar Quispe Vargas — OQV</title>
  <desc id="description">Developer in Bolivia. AI agents, Web3 and security. Build, trace, verify.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#CFDFE8" stroke-width="0.7" opacity="0.38"/>
    </pattern>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087B74"/>
      <stop offset="1" stop-color="#365F9E"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Consolas', monospace; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>
  <rect width="640" height="700" rx="22" fill="#EEF5F9"/>
  <rect width="640" height="700" rx="22" fill="url(#grid)"/>
  <rect x="16" y="16" width="608" height="668" rx="16" fill="none" stroke="#C5D9E5"/>
  <rect x="16" y="16" width="608" height="5" rx="2.5" fill="url(#orbit)"/>

  <circle cx="43" cy="44" r="5" fill="#087B74"/>
  <circle class="motion" cx="43" cy="44" r="5" fill="#087B74" opacity="0.6">
    <animate attributeName="r" values="5;10;5" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text class="mono" x="58" y="48" fill="#4A6478" font-size="12" letter-spacing="1.5">OQV / PROFILE</text>
  <text class="mono" x="597" y="48" fill="#4A6478" text-anchor="end" font-size="12">BOLIVIA / ONLINE</text>

  <rect x="29" y="69" width="582" height="324" rx="14" fill="#FFFFFF" stroke="#C5D9E5"/>
  <path d="M 50 95 h 86" stroke="#087B74" stroke-width="3" stroke-linecap="round"/>
  <text class="mono" x="50" y="125" fill="#087B74" font-size="14" font-weight="700" letter-spacing="2">BUILD / TRACE / VERIFY</text>
  <text x="47" y="207" fill="#14283B" font-size="77" font-weight="800" letter-spacing="-2">OMAR</text>
  <text x="47" y="276" fill="#14283B" font-size="68" font-weight="800" letter-spacing="-2">QUISPE</text>
  <text x="47" y="343" fill="#14283B" font-size="68" font-weight="800" letter-spacing="-2">VARGAS</text>
  <text class="mono" x="49" y="375" fill="#365F9E" font-size="14" font-weight="700">AI AGENTS  ×  WEB3  ×  SECURITY</text>

  <rect x="29" y="408" width="582" height="235" rx="14" fill="#FFFFFF" stroke="#C5D9E5"/>
  <circle cx="320" cy="519" r="94" fill="none" stroke="#C5D9E5" stroke-dasharray="3 6"/>
  <circle cx="320" cy="519" r="73" fill="none" stroke="#CFDFE8" stroke-width="11"/>
  <circle cx="320" cy="519" r="73" fill="none" stroke="url(#orbit)" stroke-width="11" stroke-dasharray="185 274" stroke-linecap="round" transform="rotate(-105 320 519)"/>
  <circle cx="320" cy="519" r="48" fill="#EAF3F8" stroke="#087B74"/>
  <text class="mono" x="320" y="529" fill="#14283B" text-anchor="middle" font-size="29" font-weight="800">OQV</text>
  <g class="motion">
    <circle cx="320" cy="425" r="5" fill="#087B74"/>
    <animateTransform attributeName="transform" type="rotate" from="0 320 519" to="360 320 519" dur="18s" repeatCount="indefinite"/>
  </g>
  <text class="mono" x="49" y="462" fill="#4A6478" font-size="10">01 / BUILD</text>
  <text class="mono" x="485" y="462" fill="#4A6478" font-size="10">02 / TRACE</text>
  <text class="mono" x="49" y="591" fill="#4A6478" font-size="10">03 / VERIFY</text>
  <text class="mono" x="491" y="591" fill="#4A6478" font-size="10">04 / SHIP</text>
  <text x="320" y="628" fill="#4A6478" text-anchor="middle" font-size="16">Systems whose results can be verified.</text>

  <text class="mono" x="31" y="672" fill="#4A6478" font-size="10">INFORMATION SECURITY / UMSA</text>
  <text class="mono" x="606" y="672" fill="#087B74" text-anchor="end" font-size="10">GITHUB.COM/OMARQV</text>
</svg>
